<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="frame" x1="145" y1="190" x2="367" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A99AE7"/>
      <stop offset="1" stop-color="#75CDBB"/>
    </linearGradient>
    <linearGradient id="violet" x1="180" y1="220" x2="286" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AE9BEA"/>
      <stop offset="1" stop-color="#8D7BD8"/>
    </linearGradient>
    <linearGradient id="mint" x1="226" y1="246" x2="338" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AD2C1"/>
      <stop offset="1" stop-color="#51B9A8"/>
    </linearGradient>
  </defs>

  <!-- Transparent canvas: only the pastel calendar mark is drawn. -->
  <g transform="translate(-92.16 -92.16) scale(1.36)">
  <path d="M145 220h222v122a44 44 0 0 1-44 44H189a44 44 0 0 1-44-44V220Z"
        fill="none" stroke="url(#frame)" stroke-width="16" stroke-linejoin="round"/>
  <path d="M145 231h222" fill="none" stroke="#C8EAE4" stroke-width="12" stroke-linecap="round"/>

  <!-- Soft, rounded binding loops. -->
  <path d="M203 153v74" fill="none" stroke="#72C8BA" stroke-width="20" stroke-linecap="round"/>
  <path d="M309 153v74" fill="none" stroke="#A695E5" stroke-width="20" stroke-linecap="round"/>

  <!-- Interwoven arrows form a light, flowing sync symbol. -->
  <path d="M195 299c-22-25-17-57 7-73 22-15 49-12 71 6" fill="none" stroke="url(#violet)" stroke-width="23" stroke-linecap="round"/>
  <path d="m269 219 25 18-31 9 6-27Z" fill="#9583DD"/>
  <path d="M317 255c22 25 17 57-7 73-22 15-49 12-71-6" fill="none" stroke="url(#mint)" stroke-width="23" stroke-linecap="round"/>
  <path d="m243 330-25-18 31-9-6 27Z" fill="#59BEAD"/>

  <!-- Three tiny dates finish the calendar without filling its transparent face. -->
  <circle cx="196" cy="357" r="8" fill="#8FD7C9"/>
  <circle cx="256" cy="357" r="8" fill="#B9ADEB"/>
  <circle cx="316" cy="357" r="8" fill="#E7BDAE"/>
  </g>
</svg>
